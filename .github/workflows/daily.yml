name: Daily brief

on:
  schedule:
    # 每周一 08:00（Asia/Shanghai） = UTC 00:00
    # 这三行由 scripts/apply_config.py 依据 config.toml 生成，不要手改
    - cron: "0 0 * * 1"
  workflow_dispatch:        # 支持手动触发，便于验证

permissions:
  contents: write           # 需要把当天 JSON 与站点提交回仓库
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    # 【云端定时已停用】key 是第三方中转站的，GitHub Actions 那边没有能用的端点，
    # 定时跑只会产出 mode=rules（0 条解读）的数据并推回仓库，盖掉本机跑出来的好数据。
    # 现在由本机的「任务计划程序」跑 scripts/daily.bat 生成并推送，
    # 站点部署交给 pages.yml（收到 push 就部署）。
    #
    # 上面的 cron 行保留不删：apply_config.py 找不到它会直接报错。定时照常触发，
    # 但下面这行 if 会让整个 job 立刻跳过，deploy 因为 needs: build 也跟着跳过。
    # 想恢复云端跑：删掉这行 if，并把能在 api.anthropic.com 直连的官方 key
    # 存进仓库 Secrets 的 ANTHROPIC_API_KEY。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: 检查 config.toml 与本工作流的定时是否同步
        # 只提醒不拦停：改了 config.toml 忘记跑 apply_config.py 时，
        # 这一步会在日志里说清楚，但不该因此让整周的更新失败。
        continue-on-error: true
        run: python scripts/apply_config.py --check

      - name: 抓取并生成当日 JSON
        env:
          # 未配置 secret 时 select() 自动降级为规则模式，任务照常成功
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_daily.py

      - name: 渲染静态站
        run: python scripts/build_site.py

      - name: 提交产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          # 没有新内容时（比如窗口内全是往日已上站的条目）不制造空提交。
          # 但要注意：仓库连续 60 天无提交，GitHub 会自动停掉 schedule 触发。
          git diff --staged --quiet && echo "无新产物，跳过提交" && exit 0
          git commit -m "daily: $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          # 手动触发与定时任务撞在一起时远端可能已经前进了，先 rebase 再推
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 保留日志便于排查失效源
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
