# ============================================================================
#  每日金融 sense —— 配置文件
#
#  这个文件是给你改的。改完不用碰任何代码，也不用找 AI。
#  下面四项是最常改的，按 1 2 3 4 排好了。再往下是不常用的高级项。
#
#  改完记得看每一项下面的「改完要做什么」。
#  删掉某一行会自动回到内置默认值，所以不确定的项直接删掉比填错更安全。
#  填错了也不会让站点挂掉，只会在日志里提醒一句然后用默认值。
# ============================================================================


# ════════════════════════════════════════════════════════════════════════════
#  1. 更新周期 —— 什么时候自动更新
# ════════════════════════════════════════════════════════════════════════════
[schedule]

# 标准 5 段 cron 写法：分 时 日 月 星期
# 星期：1=周一  2=周二  3=周三  4=周四  5=周五  6=周六  0=周日
#
#   "0 8 * * *"      每天 08:00         ← 当前设置
#   "0 8 * * 1"      每周一 08:00
#   "0 8 * * 1,4"    每周一和周四 08:00
#   "30 7 * * 1"     每周一 07:30
#   "0 20 * * 5"     每周五 20:00
#
# 按下面的 timezone 写本地时间就行，不用自己换算 UTC。
cron = "0 8 * * *"

# 上面那个时间按哪个时区算。国内不用动。
timezone = "Asia/Shanghai"

# 【改时间】本机自动化由 Windows 任务计划程序负责，它不读这个文件，只认系统
# 本地时间。改成每天跑（默认就是每天 08:00）：
#     powershell -ExecutionPolicy Bypass -File scripts\install_task.ps1 -Daily -At "08:00"
#
# 上面的 cron/timezone 现在只是「默认计划」的说明。scripts/apply_config.py
# 只在将来重新启用 GitHub Actions 云端定时时才需要（把本地时间换算成 UTC
# 写进 .github/workflows/daily.yml）。
#
# 【想立刻更新一次、不等定时】本机：schtasks /run /tn DailyBrief


# ════════════════════════════════════════════════════════════════════════════
#  2. 输出条数 —— 每个板块出几条解读
# ════════════════════════════════════════════════════════════════════════════
[output]

# 三个板块（市场·货币·金融 / 政策·地缘大事件 / 科技·AI 与产业）各出几条。
#
# 【注意】2026-09-11 起解读回到**四段**（发生了什么 / 市场为什么在意 /
# 金融传导 / 解析）。七段那版每条输出量是四段的约 6 倍，已退回。
# per_category=1 → 三个板块共 3 条/天，是现在的稳定值。
# 要调大得同时盯 max_tokens 会不会截断。
per_category = 1

# 每个板块送进模型的候选数。三个板块各 6 条 = 18 条进 prompt。
# 太小会错过重要新闻，6 是平衡点。
pool_size = 6

# 同一个来源在单个板块里最多占几条。防止华尔街见闻一家占满所有席位。
# per_category=1 时这条天然不起作用（一个板块就出一条），保持 2 是为了哪天调大
# per_category 时限额立刻生效，不用再回来改。
max_per_source = 2

# 【改完要做什么】不用做什么，下次更新自动生效。


# ════════════════════════════════════════════════════════════════════════════
#  3. 软件名称 —— 网页标题与页面上的大标题
# ════════════════════════════════════════════════════════════════════════════
[site]

name = "知势|Daily Brief"

# 大标题下面那行小字。不想要就写 tagline = ""
tagline = "全球政经大事 · 趋势与影响"

# 页脚第一行。第二行的免责声明是写死的。
footer = "每天更新 · 市场货币金融 / 政策地缘大事件"

# 页面底部「历史归档」最多列出多少天
archive_days = 60

# 【改完要做什么】跑这一句就能在本地看到效果：
#     python scripts/build_site.py


# ════════════════════════════════════════════════════════════════════════════
#  4. 解读 prompt —— AI 怎么写解读
# ════════════════════════════════════════════════════════════════════════════
[llm.prompt]

# 【推荐用法】只写「追加要求」，不用重写整个 prompt。
# 这里写的内容会附在内置 prompt 最后面，优先级压过内置要求。
# 想恢复默认就改回 extra = ""
#
# 可以直接抄的例子：
#   extra = "解析部分每一条都用设问开头，像「为什么 2Y 先动？」"
#   extra = "我是完全的新手，专业名词第一次出现必须用括号解释一遍。"
#   extra = "优先选中国相关的新闻，解读里多讲对 A 股和人民币的影响。"
#   extra = "传导链请拉到 15 环以上，每一环都要极细。"
#   extra = "每条解读最后加一句面试官可能会怎么追问。"
#
# 想写多行就用三个单引号：
#   extra = '''
#   第一条要求。
#   第二条要求。
#   '''
extra = ""


# 【高级用法】整段替换内置 prompt。一般不需要动，改坏了整站会没有解读。
#
# 填了非空内容就完全接管内置 prompt（上面的 extra 仍会附在它后面）。
# 三个硬性要求：
#   · 必须包含 {{CANDIDATES}} 占位符 —— 候选新闻列表会替换到那个位置。
#     少了它模型就会凭空编新闻，所以缺了会被忽略、自动回到内置 prompt。
#   · 必须要求模型输出 JSON，且每条含四段：what / why / chain / notes。
#   · chain 的环数不少于下面 [llm] min_chain_hops 的值。
# 不满足后两条会被校验拦下，每次更新都变成「今日无 AI 解读」。
#
# 想看内置 prompt 长什么样：
#     python scripts/apply_config.py --show-prompt
template = ""


# ════════════════════════════════════════════════════════════════════════════
#  以下是高级项，不确定就别动
# ════════════════════════════════════════════════════════════════════════════

[llm]

# 用哪个模型。你的 key 是第三方中转站，当前这把 key 绑定 deepseek-v4-flash：
# claude-opus-5 在它上面报 402「budget pool quota exhausted」（该池无额度/无通道）。
# 换 key 后可改回 claude-opus-5。
model = "deepseek-v4-flash"

# 单次输出上限。四段解读很短，3 张卡片实测约 3KB，8000 已经留足余量。
# 撞上限会被截断 → JSON 不完整 → 自动重试一次（日志里有明确告警）。
max_tokens = 8000

# 关掉模型的思考块。deepseek-v4-flash 实测思考占掉 ~85% 输出预算，
# 不关的话正文会被思考吃完、直接截断。保持 true 即可。
disable_thinking = true

# 输出不合格时最多重试几次。每次更新的 API 调用数 = 1 + 这个值。
# 填 0 就是不重试，一次不合格直接变成没有解读的规则模式。
max_retries = 1

# 传导链至少几环。这是质量下限，不是格式检查 —— 环数少就意味着中间机制
# 被压缩成了结论，也就是当初「看不懂」的根因。不建议调到 5 以下。
min_chain_hops = 5

# 解析至少几条。低于 3 条等于退回改版前那种「只讲一个概念」。
min_notes = 3


[fetch]

# 抓多久以内的新闻，单位小时。36 = 一天半。
# 【改成每周更新后建议调大】不然只能看到周一前一天半的新闻，
# 一整周的重要事件会漏掉。168 = 整整一周。
window_hours = 168

# 官方源（美联储 / ECB / 白宫 / USTR）几天才发一条，单独给宽窗口。
slow_window_hours = 336

# 相关性闸门阈值 0~1，低于此值的条目不进候选池，实测拦下率约七成。
# 调高 = 更严但可能漏掉硬新闻；调低 = 软新闻（三明治店、旅游）会混进来。
# 0.30 是实测过的甜点值，不建议动。
relevance_threshold = 0.30


[output_advanced_notes]
# 候选池相关的项在上面 [output] 里已经列出来了（pool_size / max_per_source）：
#   pool_size = 6               每板块送进 AI 的候选数，调大 = 输入 token 变多
#   candidates_per_source = 4   候选池阶段同一来源最多进几条（默认值，未改）
# 真要改就把它们写进上面的 [output] 段里。
